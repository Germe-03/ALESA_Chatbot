<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ALESA Mitarbeiterportal - Bestellungen & Chats</title>
    <link rel="stylesheet" href="/assets/style.css" />
    <style>
      .table{width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--border); border-radius:12px; overflow:hidden}
      th,td{padding:10px 12px; border-bottom:1px solid var(--border); text-align:left; vertical-align:top}
      th{background:var(--primary-050); color:var(--primary-600)}
      tr:hover td{background:#fafcff}
      .pill{display:inline-block; padding:2px 8px; border-radius:999px; background:var(--primary-050); color:var(--primary-600); margin-right:6px}
      .small{color:var(--muted); font-size:.85rem}
      .wrap{white-space:pre-wrap}
      .tabs{display:flex; gap:10px; margin:12px 0 18px}
      .tab{padding:8px 14px; border:1px solid var(--border); background:#fff; border-radius:10px; cursor:pointer; font-weight:600; color:var(--muted)}
      .tab.active{background:var(--primary-050); color:var(--primary-600); border-color:var(--primary-200,#d3e4ff)}
      .flex{display:flex; gap:16px}
      .panel{background:#fff; border:1px solid var(--border); border-radius:12px; padding:12px; flex:1; min-height:320px; box-shadow:0 10px 30px rgba(11,108,255,.06)}
      .session{padding:10px 12px; border:1px solid var(--border); border-radius:10px; margin-bottom:8px; cursor:pointer; background:#fafcff}
      .session.active{border-color:var(--primary); box-shadow:0 0 0 2px rgba(11,108,255,.1)}
      .session-id{font-weight:700; font-size:.95rem}
      .muted{color:var(--muted)}
      .msg-card{border:1px solid var(--border); border-radius:12px; padding:10px 12px; margin-bottom:8px; background:#fff}
      .msg-role{font-weight:700; color:var(--primary-600); margin-bottom:4px}
      .chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px}
      .chip{background:var(--primary-050); color:var(--primary-600); padding:2px 8px; border-radius:999px; font-size:.8rem}
      .cluster-card{border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:10px; background:#fff}
      .tagline{display:inline-block; padding:2px 8px; border-radius:999px; background:var(--primary-050); color:var(--primary-600); margin-right:6px; font-size:.8rem}
      #session-list{max-height:720px; overflow-y:auto; padding-right:4px}
    </style>
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="container">
          <div class="brand">
            <div class="logo" aria-hidden="true"></div>
            <div>
              <div class="title">Mitarbeiterportal</div>
              <div class="subtitle">Bestellungen & Chat-Insights</div>
            </div>
          </div>
        </div>
      </header>
      <main class="container" style="padding:20px 16px 120px">
        <div class="tabs">
          <button class="tab active" data-tab="orders">Bestellungen</button>
          <button class="tab" data-tab="chats">Chats</button>
          <button class="tab" data-tab="clusters">Cluster</button>
          <button class="tab" data-tab="analytics">Analytics</button>
        </div>

        <section id="orders-section">
          <h2>Bestellungen</h2>
          <div id="meta" class="small"></div>
          <div style="overflow:auto">
            <table class="table" id="tbl">
              <thead>
                <tr>
                  <th>ID/Zeit</th>
                  <th>Kunde</th>
                  <th>Positionen</th>
                  <th>Kommentar</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </section>

        <section id="chats-section" style="display:none">
          <div class="flex">
            <div class="panel" style="max-width:320px">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; gap:8px">
                <h3 style="margin:0">Sessions</h3>
                <div id="chat-meta" class="small"></div>
              </div>
              <input id="session-search" type="text" placeholder="Session-ID suchen" style="width:100%; margin-bottom:8px; padding:8px; border-radius:8px; border:1px solid var(--border)">
              <div id="session-list"></div>
            </div>
            <div class="panel">
              <div id="session-title" class="muted small" style="margin-bottom:8px">Session waehlen</div>
              <div id="messages"></div>
            </div>
          </div>
        </section>

        <section id="clusters-section" style="display:none">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px">
            <h2 style="margin:0">Themen-Cluster</h2>
            <label class="small">Cluster: <input type="number" id="cluster-count" value="8" min="2" max="50" style="width:60px"></label>
            <button class="btn" id="refresh-clusters" style="height:auto; padding:6px 12px; box-shadow:none">Neu laden</button>
          </div>
          <div id="cluster-meta" class="small"></div>
          <div id="cluster-list"></div>
        </section>

        <section id="analytics-section" style="display:none">
          <h2>Analytics & Trends</h2>
          <div id="analytics-meta" class="small"></div>
          <div class="panel" style="margin-top:10px">
            <h3>Cluster (Auswertung)</h3>
            <div id="analytics-clusters"></div>
          </div>
          <div class="panel" style="margin-top:10px">
            <h3>Dokument-Trends</h3>
            <div id="analytics-docs"></div>
          </div>
          <div class="panel" style="margin-top:10px">
            <h3>Produkt-Trends</h3>
            <div class="small muted">Forecast via Gradient Boosting (3-Perioden-Fenster, Fallback: letzter Wert).</div>
            <div id="analytics-prods"></div>
          </div>
        </section>
      </main>
    </div>

    <script>
      const state = {tab:'orders', sessions:[], selected:null, clusters:[], sessionSearch:''};
      const analytics = {loaded:false, data:null};

      function escapeHtml(s){
        return (s||'')
          .replaceAll('&','&amp;')
          .replaceAll('<','&lt;')
          .replaceAll('>','&gt;')
          .replaceAll('"','&quot;')
          .replaceAll("'",'&#39;');
      }

      async function loadOrders(){
        const r = await fetch('/admin/orders');
        const j = await r.json();
        const rows = j.orders || [];
        document.getElementById('meta').textContent = `${rows.length} Bestellung(en)`;
        const tb = document.querySelector('#tbl tbody');
        tb.innerHTML = '';
        for (const o of rows){
          const tr = document.createElement('tr');
          const cust = o.customer || {}; const items = o.items||[];
          const cell = (html)=>{ const td=document.createElement('td'); td.innerHTML=html; return td };
          tr.appendChild(cell(`<div><strong>${escapeHtml(o.id)}</strong></div><div class="small">${escapeHtml(o.created_at)||''}</div>`));
          tr.appendChild(cell(`${cust.kundennummer?`Kundennr.: ${escapeHtml(cust.kundennummer)}<br>`:''}${escapeHtml(cust.typ)||''} ${escapeHtml(cust.name)||''}<br>${escapeHtml(cust.strasse_nr)||''}<br>${escapeHtml(cust.plz_ort)||''}<br>${escapeHtml(cust.email)||''}`));
          tr.appendChild(cell(items.map((it,i)=>`<span class="pill">${i+1}</span> ${escapeHtml(it.artikelnummer)||'-'} \u2013 ${escapeHtml(it.menge)||'-'}`).join('<br>')));
          tr.appendChild(cell(`<div class="wrap">${escapeHtml(o.comment)||''}</div>`));
          tb.appendChild(tr);
        }
      }
      loadOrders().catch(console.error);
      setInterval(loadOrders, 5000);

      async function loadChats(){
        if (state.tab !== 'chats') return;
        const r = await fetch('/admin/chats');
        const j = await r.json();
        state.sessions = j.chats || [];
        renderSessions();
      }

      function renderSessions(){
        const list = document.getElementById('session-list');
        list.innerHTML = '';
        document.getElementById('chat-meta').textContent = `${state.sessions.length} Session(s)`;
        if (!state.sessions.length){
          list.innerHTML = '<div class="muted small">Keine Sessions gespeichert.</div>';
          return;
        }
        const term = (state.sessionSearch||'').toLowerCase().trim();
        const filtered = term ? state.sessions.filter(s => (s.session_id||'').toLowerCase().includes(term)) : state.sessions;
        if (!filtered.length){
          list.innerHTML = '<div class="muted small">Keine Sessions gefunden.</div>';
          return;
        }
        for (const s of filtered){
          const div = document.createElement('div');
          div.className = 'session' + (s.session_id===state.selected ? ' active':'');
          div.innerHTML = `
            <div class="session-id">${escapeHtml(s.session_id)}</div>
            <div class="small muted">${escapeHtml(s.created_at)||'-'} - ${escapeHtml(s.last_seen)||''}</div>
            <div class="small">${s.messages||0} Nachricht(en)</div>
          `;
          div.addEventListener('click', ()=> selectSession(s.session_id));
          list.appendChild(div);
        }
      }

      async function selectSession(sessionId){
        state.selected = sessionId;
        document.getElementById('session-title').textContent = sessionId ? `Session ${sessionId}` : 'Session waehlen';
        const r = await fetch(`/admin/chats/${encodeURIComponent(sessionId)}`);
        const j = await r.json();
        renderMessages(j.messages || []);
        renderSessions(); // update highlight
      }

      function renderMessages(msgs){
        const wrap = document.getElementById('messages');
        wrap.innerHTML = '';
        if (!msgs.length){
          wrap.innerHTML = '<div class="muted small">Keine Nachrichten in dieser Session.</div>';
          return;
        }
        for (const m of msgs){
          const card = document.createElement('div');
          card.className = 'msg-card';
          const role = escapeHtml(m.role || '');
          const body = escapeHtml(m.message || '').replace(/\\n/g,'<br>');
          card.innerHTML = `
            <div class="msg-role">${role.toUpperCase()} <span class="small muted" style="font-weight:400">${escapeHtml(m.ts||'')}</span></div>
            <div class="wrap">${body}</div>
          `;
          const chips = [];
          const sources = Array.isArray(m.sources) ? m.sources : [];
          for (const s of sources){ chips.push(`<span class="chip">${escapeHtml(s)}</span>`); }
          if (chips.length){
            const chipsWrap = document.createElement('div');
            chipsWrap.className = 'chips';
            chipsWrap.innerHTML = chips.join('');
            card.appendChild(chipsWrap);
          }
          wrap.appendChild(card);
        }
      }

      async function loadClusters(){
        if (state.tab !== 'clusters') return;
        const n = Number(document.getElementById('cluster-count').value) || 8;
        const r = await fetch(`/admin/clusters?n_clusters=${encodeURIComponent(n)}`);
        const j = await r.json();
        state.clusters = j.clusters || [];
        renderClusters();
      }

      function renderClusters(){
        const wrap = document.getElementById('cluster-list');
        wrap.innerHTML = '';
        document.getElementById('cluster-meta').textContent = `${state.clusters.length} Cluster`;
        if (!state.clusters.length){
          wrap.innerHTML = '<div class="muted small">Keine Cluster berechnet.</div>';
          return;
        }
        for (const c of state.clusters){
          const card = document.createElement('div');
          card.className = 'cluster-card';
          const examples = (c.example_queries||[]).map(t=>`<div class="small">\u2022 ${escapeHtml(t)}</div>`).join('');
          const terms = (c.top_terms||[]).slice(0,10).map(t=>`<span class="tagline">${escapeHtml(t)}</span>`).join('');
          card.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px">
              <div><strong>Cluster ${c.cluster_id}</strong></div>
              <div class="small muted">${c.count||0} Anfragen</div>
            </div>
            <div class="small muted">Top-Terme</div>
            <div style="margin:6px 0">${terms || '<span class="muted small">Keine Terme</span>'}</div>
            <div class="small muted">Beispiele</div>
            ${examples || '<div class="muted small">Keine Beispiele</div>'}
          `;
          wrap.appendChild(card);
        }
      }

      function switchTab(tab){
        state.tab = tab;
        document.querySelectorAll('.tab').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.tab === tab);
        });
        document.getElementById('orders-section').style.display = tab === 'orders' ? 'block' : 'none';
        document.getElementById('chats-section').style.display = tab === 'chats' ? 'block' : 'none';
        document.getElementById('clusters-section').style.display = tab === 'clusters' ? 'block' : 'none';
        document.getElementById('analytics-section').style.display = tab === 'analytics' ? 'block' : 'none';
        if (tab === 'chats'){ loadChats(); }
        if (tab === 'clusters'){ loadClusters(); }
        if (tab === 'analytics'){ loadAnalytics(); }
      }

      document.querySelectorAll('.tab').forEach(btn=>{
        btn.addEventListener('click', ()=> switchTab(btn.dataset.tab));
      });
      document.getElementById('refresh-clusters').addEventListener('click', ()=> loadClusters().catch(console.error));
      document.getElementById('session-search').addEventListener('input', (e)=>{ state.sessionSearch = e.target.value; renderSessions(); });

      setInterval(loadChats, 6000);

      async function loadAnalytics(){
        if (analytics.loaded) return;
        const r = await fetch('/admin/ml');
        const j = await r.json();
        analytics.data = j;
        analytics.loaded = true;
        renderAnalytics();
      }

      function renderAnalytics(){
        const meta = document.getElementById('analytics-meta');
        const clustersDiv = document.getElementById('analytics-clusters');
        const docsDiv = document.getElementById('analytics-docs');
        const prodsDiv = document.getElementById('analytics-prods');
        const clusters = analytics.data?.clusters?.overview || [];
        meta.textContent = `${clusters.length} Cluster gefunden`;
        clustersDiv.innerHTML = clusters.slice(0,5).map(c=>`
          <div class="small" style="margin-bottom:6px">
            <strong>Cluster ${c.cluster_id}</strong> (${c.count}) - ${Array.isArray(c.top_terms)?c.top_terms.slice(0,5).join(', '):''}<br>
            Beispiele: ${(c.example_queries||[]).slice(0,2).join(' | ')}
          </div>
        `).join('') || '<div class="small muted">Keine Cluster berechnet.</div>';

        const docs = analytics.data?.documents?.trends || [];
        const docRows = docs.slice(0,10).sort((a,b)=> (b.trend_slope||0)-(a.trend_slope||0));
        docsDiv.innerHTML = docRows.map(d=>`
          <div class="small" style="margin-bottom:4px">
            <strong>${escapeHtml(d.title||d.document_id||'-')}</strong> (${escapeHtml(d.category||'')})<br>
            Trend: ${escapeHtml(d.trend_label||'-')} (${Number(d.trend_slope||0).toFixed(3)}), Nutzungen 30T: ${d.uses_last_30_days||0}
          </div>
        `).join('') || '<div class="small muted">Keine Dokument-Trends.</div>';

        const prods = analytics.data?.products?.trends || [];
        const prodRows = prods.slice(0,10).sort((a,b)=> (b.trend_slope||0)-(a.trend_slope||0));
        prodsDiv.innerHTML = prodRows.map(p=>`
          <div class="small" style="margin-bottom:4px">
            <strong>${escapeHtml(p.name||p.product_id||'-')}</strong> (${escapeHtml(p.category||'')})<br>
            Trend: ${escapeHtml(p.trend_label||'-')} (${Number(p.trend_slope||0).toFixed(3)}), Orders 30T: ${p.orders_last_30_days||0}, Forecast (GB): ${p.forecast_next_period||0}
          </div>
        `).join('') || '<div class="small muted">Keine Produkt-Trends.</div>';
      }
    </script>
  </body>
</html>
