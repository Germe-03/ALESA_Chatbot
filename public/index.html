<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reinhard – ALESA KI-Assistent</title>
    <meta name="color-scheme" content="light" />
    <link rel="preload" href="/assets/style.css" as="style">
    <link rel="stylesheet" href="/assets/style.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="container">
          <div class="brand">
            <div class="logo" aria-hidden="true"></div>
            <div>
              <div class="title">Reinhard – ALESA KI-Assistent</div>
              <div class="subtitle">Blau-Weiss, schnell und fokussiert auf Antworten mit Quellen</div>
            </div>
          </div>
        </div>
      </header>

      <main>
        <section class="container chat" id="chat">
          <div id="empty" class="empty">
            <div class="hero"></div>
            <h2>Willkommen!</h2>
            <p>Stelle deine Frage - Reinhard findet passende Stellen in den ALESA-Dokumenten.</p>
          </div>
        </section>
      </main>

      <div class="composer">
        <div class="inner">
          <div class="inputbar">
            <textarea id="q" placeholder="Schreibe hier deine Frage (Enter zum Senden, Shift+Enter fuer Zeilenumbruch)"></textarea>
            <button id="send" class="btn" title="Senden">Senden</button>
          </div>
          <div class="hint" style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap">
            <span>Hinweis: Der Bot antwortet nur auf Basis der verfuegbaren Dokumente und zeigt Quellen an.</span>
            <button id="new-session" class="btn" style="height:32px; padding:0 10px; box-shadow:none">Neuen Chat starten</button>
          </div>
        </div>
      </div>
    </div>

    <script src="/assets/app.js" defer></script>
  </body>
 </html>
